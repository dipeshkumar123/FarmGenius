name: Build Android APK for Distribution

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Java Environment
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.19.0' # Pinned version as per STACK.md principles

      - name: Generate Native Scaffolding
        run: |
          flutter create .
          sed -i '/android {/a \    aaptOptions {\n        noCompress "tflite"\n    }' android/app/build.gradle
        working-directory: ./app

      - name: Install Dependencies
        run: flutter pub get
        working-directory: ./app

      - name: Build APK (Release mode)
        # Builds a fat APK containing ARM and ARM64 suitable for WhatsApp distribution
        run: flutter build apk --release
        working-directory: ./app

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v3
        with:
          name: farmgenius-app-release
          path: app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
