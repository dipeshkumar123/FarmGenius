name: Build Android APK for Distribution

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - '.github/workflows/build_apk.yml'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java Environment
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.24.0' # Updated to support Gradle 8+ / AGP 8+

      - name: Generate Native Scaffolding
        run: echo "Using checked-in native Android configuration"
        working-directory: ./app

      - name: Install Dependencies
        run: flutter pub get
        working-directory: ./app

      - name: Build APK (Release mode)
        # Builds a fat APK containing ARM and ARM64 suitable for WhatsApp distribution
        run: flutter build apk --release
        working-directory: ./app

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: farmgenius-app-release
          path: app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
