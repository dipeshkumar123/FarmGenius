services:
  - type: web
    name: farmgenius-backend
    env: python
    region: singapore
    buildCommand: "pip install -r requirements-api.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: DATA_GOV_IN_API_KEY
        sync: false
      - key: ENVIRONMENT
        value: production
