name: farmgenius
description: An agricultural advisor app for Indian smallholder farmers.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.4.9
  go_router: ^12.1.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  dio: ^5.4.0
  tflite_flutter: ^0.10.4
  speech_to_text: ^6.5.1
  flutter_tts: ^3.8.3
  image_picker: ^1.0.7
  path_provider: ^2.1.2
  permission_handler: ^11.2.0
  image: ^4.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/models/model_quant.tflite
    - assets/models/labels_indian_crops.txt
