name: farmgenius
description: AI-powered smart farming assistant for smallholder farmers in India.
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.4.9

  # Navigation
  go_router: ^12.1.3

  # Networking
  dio: ^5.4.0

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.0.0

  # ML / On-Device
  tflite_flutter: ^0.10.4

  # Camera & Images
  image_picker: ^1.0.7
  cached_network_image: ^3.3.1

  # Speech
  speech_to_text: ^6.5.1
  flutter_tts: ^3.8.3

  # UI & Animation
  google_fonts: ^6.1.0
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0
  smooth_page_indicator: ^1.1.0
  lottie: ^3.1.0

  # Charts
  fl_chart: ^0.67.0

  # Utilities
  path_provider: ^2.1.2
  permission_handler: ^11.2.0
  image: ^4.1.3
  geolocator: ^11.0.0
  intl: any
  uuid: ^4.3.3
  share_plus: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/models/model_quant.tflite
    - assets/models/labels_indian_crops.txt
    - assets/images/
    - assets/lottie/
